<!doctype html>
<html lang="en" dir="ltr" data-theme="light" data-palette="emerald" data-shape="rounded">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nūr al-Dhikr — Adhkar &amp; Duas</title>
    <meta
      name="description"
      content="An offline-first daily companion for Adhkar, Duas, and the 99 Names of Allah — with prayer times, a Hijri calendar, tasbih counter, the complete Qur'an, and a full content editor."
    />
    <!-- Verses and hadith numbers must never become tap-to-call links on iOS. -->
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nūr al-Dhikr — Adhkar &amp; Duas" />
    <meta
      property="og:description"
      content="An offline-first daily companion for Adhkar, Duas, and the 99 Names of Allah — with prayer times, a Hijri calendar, tasbih counter, the complete Qur'an, and a full content editor."
    />
    <meta property="og:image" content="assets/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Runtime theme-color is kept in sync with the active palette by
         core/theme.js; this initial value matches the default emerald
         palette's light surface so first paint, install splash, and in-app
         chrome agree (the v3 mismatch shipped three different colors). -->
    <meta name="theme-color" content="#faf9f5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nūr al-Dhikr" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="assets/fonts/Amiri-Regular.woff2"
      crossorigin
    />
    <!-- Amiri Quran is the default Mushaf font (core/config.js) — the
         flagship view's first paint needs it, so it gets the same priority. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="assets/fonts/AmiriQuran.woff2"
      crossorigin
    />

    <!-- Design system: strict load order (tokens → base → layout →
         components → cards → quran → motion → accessibility). -->
    <link rel="stylesheet" href="assets/css/variables.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/cards.css" />
    <link rel="stylesheet" href="assets/css/quran.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
    <link rel="stylesheet" href="assets/css/desktop.css" />
    <link rel="stylesheet" href="assets/css/accessibility.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- App shell mounts. Only app/renderer.js, app/boot.js, and the
         delegated event system in app/events.js ever touch these nodes;
         views are pure string templates patched into #main. -->
    <div id="app">
      <header class="topbar" id="topbar" role="banner"></header>

      <main id="main" role="main" tabindex="-1"></main>

      <nav class="bottomnav" id="bottomnav" aria-label="Primary"></nav>
      <!-- playerBar.js sets role="region" + a localized aria-label on mount;
           a bare aria-label on a role-less div is ignored by assistive tech. -->
      <div id="playerbar"></div>
    </div>

    <!-- Modals announce themselves via dialog semantics + focus movement;
         an aria-live wrapper here made every dialog double-announced. -->
    <div id="modal-root"></div>
    <div id="toast-root" role="status" aria-live="polite"></div>
    <div id="counter-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <!-- Hidden file inputs driven by the delegated change handler. -->
    <input
      type="file"
      id="backup-file-input"
      accept="application/json"
      class="sr-only"
      tabindex="-1"
    />
    <input type="file" id="adhan-file-input" accept="audio/*" class="sr-only" tabindex="-1" />

    <noscript>
      <div
        style="
          padding: 2rem;
          font-family: sans-serif;
          max-width: 480px;
          margin: 0 auto;
          text-align: center;
        "
      >
        <h1>Nūr al-Dhikr</h1>
        <p>
          This app requires JavaScript to run. Please enable JavaScript in your browser settings.
        </p>
      </div>
    </noscript>

    <!-- (v4.4) file:// guard. The app is a no-build ES-module PWA: every
         browser CORS-blocks module scripts loaded from file://, so
         double-clicking index.html out of an extracted zip renders a dead
         white page — silently, with no console-visible page error. This
         classic inline script always executes and paints an actionable,
         self-contained explanation instead. app/boot.js removes the notice
         if a module-capable context ever appears. -->
    <script>
      (function () {
        if (location.protocol !== 'file:') return;
        var n = document.createElement('div');
        n.id = 'file-protocol-notice';
        n.setAttribute('role', 'alert');
        n.setAttribute('dir', 'ltr');
        // NOTE (2026-09 audit S2): static-only innerHTML — this string is a
        // hardcoded literal with no user/backup/network input. Keep it that
        // way; never interpolate variables here without escaping.
        n.innerHTML =
          '<style>' +
          '#file-protocol-notice{position:fixed;inset:0;z-index:2147483647;overflow:auto;background:#faf9f5;color:#1c2421;' +
          "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;line-height:1.6}" +
          '#file-protocol-notice .fpn{max-width:560px;margin:0 auto;padding:48px 24px 64px}' +
          '#file-protocol-notice .fpn__mark{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;' +
          'background:#0f766e;display:flex;align-items:center;justify-content:center}' +
          '#file-protocol-notice h1{font-size:1.45rem;margin:0 0 4px;text-align:center;color:#134e4a}' +
          '#file-protocol-notice .fpn__sub{text-align:center;color:#5f6f6b;margin:0 0 28px;font-size:.95rem}' +
          '#file-protocol-notice .fpn__card{background:#fff;border:1px solid #e3e0d6;border-radius:14px;' +
          'padding:20px 20px 24px;margin:0 0 16px}' +
          '#file-protocol-notice h2{font-size:1.02rem;margin:0 0 10px;color:#134e4a}' +
          '#file-protocol-notice ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:12px}' +
          '#file-protocol-notice li{font-size:.92rem}' +
          '#file-protocol-notice b{color:#0f766e}' +
          '#file-protocol-notice code{font-family:Consolas,Menlo,monospace;font-size:.85rem;background:#f0efe9;' +
          'border:1px solid #e3e0d6;border-radius:6px;padding:2px 6px;word-break:break-all}' +
          '#file-protocol-notice a{color:#0f766e;font-weight:600}' +
          '#file-protocol-notice .fpn__why{font-size:.85rem;color:#6b7a76;background:#f0efe9;border-radius:10px;' +
          'padding:12px 14px;margin:16px 0 0}' +
          '#file-protocol-notice .fpn__ar{direction:rtl;text-align:right;font-size:.88rem;color:#42504c;' +
          'background:#fff;border:1px solid #e3e0d6;border-radius:14px;padding:16px 20px;margin-top:16px}' +
          '</style>' +
          '<div class="fpn">' +
          '<div class="fpn__mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#faf9f5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></div>' +
          '<h1>Nūr al-Dhikr needs a local web server</h1>' +
          '<p class="fpn__sub">You opened <code>index.html</code> directly from the folder — every browser blocks web-app code from running that way.</p>' +
          '<div class="fpn__card">' +
          '<h2>How to run it (pick one)</h2>' +
          '<ol>' +
          '<li><b>Easiest — use a launcher.</b> In the folder you extracted, double-click <code>Start-Here-Windows.bat</code> (Windows) or <code>Start-Here-Mac.command</code> (macOS), or run <code>./Start-Here-Linux.sh</code> (Linux). A browser tab opens by itself.</li>' +
          '<li><b>Any terminal.</b> From this folder run <code>python3 -m http.server 8080</code>, then open <a href="http://localhost:8080/">http://localhost:8080</a>.</li>' +
          '<li><b>Host it once.</b> Drag this folder onto <a href="https://app.netlify.com/drop" target="_blank" rel="noreferrer">Netlify Drop</a> or GitHub Pages. After the first visit, the app works fully offline.</li>' +
          '</ol>' +
          '<p class="fpn__why"><b>Why:</b> this is an offline-first installable web app (a PWA) built as standard ES modules. Browsers only load module code over HTTP(S), never straight from the disk — that is a browser security rule, not a problem with your copy of the app.</p>' +
          '</div>' +
          '<div class="fpn__ar" lang="ar" dir="rtl">' +
          '<b>التطبيق يحتاج خادم ويب محلي</b><br>' +
          'فتحتَ <code>index.html</code> مباشرةً من المجلد، والمتصفحات تمنع تشغيل تطبيقات الويب بهذه الطريقة. الأسهل: انقر مرتين على <code>Start-Here-Windows.bat</code> (ويندوز) أو <code>Start-Here-Mac.command</code> (ماك) أو شغّل <code>./Start-Here-Linux.sh</code> (لينكس). أو من الطرفية: <code>python3 -m http.server 8080</code> ثم افتح <a href="http://localhost:8080/">http://localhost:8080</a>. بعد أول زيارة عبر الخادم يعمل التطبيق دون اتصال بالكامل.' +
          '</div>' +
          '</div>';
        (document.body || document.documentElement).appendChild(n);
      })();
    </script>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
