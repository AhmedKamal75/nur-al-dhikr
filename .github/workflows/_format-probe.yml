name: temporary format probe
on:
  push:
    branches:
      - feature/practice-ia
permissions:
  contents: read
jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write assets/css/practice.css js/views/practice.js js/core/config/views.js js/core/config/nav.js js/app/renderer.js tests/practice-view.test.js tests/nav-reachability.test.js js/core/i18n/en.js js/core/i18n/ar.js sw.js
      - run: git diff -- assets/css/practice.css js/views/practice.js js/core/config/views.js js/core/config/nav.js js/app/renderer.js tests/practice-view.test.js tests/nav-reachability.test.js js/core/i18n/en.js js/core/i18n/ar.js sw.js
