name: check

on:
  push:
  pull_request:

jobs:
  check:
    name: lint + format + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: browser smoke + races
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  browser-evidence:
    name: 4-viewport evidence matrix + traces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: EVIDENCE_MATRIX=1 npm run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-traces
          path: test-results/
          retention-days: 30

  accessibility:
    name: accessibility static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/a11y-budget.test.js tests/a11yPrefs.test.js
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/a11y-axe.spec.js --project=chromium
