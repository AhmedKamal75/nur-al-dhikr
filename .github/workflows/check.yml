name: check

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + format + unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Capture Prettier formatting diff
        if: always() && matrix.node == 20
        run: |
          for file in js/domain/tajweed.js tests/tajweed-rasm-equivalence.test.js tests/tajweed-rule-spec.test.js; do
            mkdir -p "/tmp/tajweed-prettier/original/$(dirname "$file")"
            mkdir -p "/tmp/tajweed-prettier/formatted/$(dirname "$file")"
            mkdir -p "/tmp/tajweed-prettier/diffs/$(dirname "$file")"
            cp "$file" "/tmp/tajweed-prettier/original/$file"
            npx prettier "$file" > "/tmp/tajweed-prettier/formatted/$file"
            diff -u "/tmp/tajweed-prettier/original/$file" "/tmp/tajweed-prettier/formatted/$file" > "/tmp/tajweed-prettier/diffs/$file.diff" || true
          done
      - name: Upload Prettier formatting evidence
        if: always() && matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: tajweed-prettier-format
          path: /tmp/tajweed-prettier/
          retention-days: 1
      - run: npm run compress-data
      - run: npm run check

  e2e:
    name: browser smoke + races
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compress-data
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  browser-evidence:
    name: 4-viewport evidence matrix + traces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compress-data
      - run: npx playwright install --with-deps chromium
      - run: EVIDENCE_MATRIX=1 npm run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-traces
          path: test-results/
          retention-days: 30

  cross-engine:
    name: cross-engine release matrix (smoke/audio/a11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compress-data
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: >-
          CROSS_ENGINE=1 npx playwright test tests/e2e/smoke.spec.js
          tests/e2e/player-chrome.spec.js tests/e2e/volume-regression.spec.js
          tests/e2e/a11y-axe.spec.js tests/e2e/routes-extended.spec.js
        env:
          CI: true

  accessibility:
    name: accessibility static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/a11y-budget.test.js tests/a11yPrefs.test.js
      - run: npm run compress-data
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/a11y-axe.spec.js --project=chromium

  tajweed-rasm-audit:
    name: full-corpus cross-rasm Tajweed diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run audit:tajweed-rasm > tajweed-rasm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tajweed-rasm-audit
          path: tajweed-rasm-audit.json
          retention-days: 30
